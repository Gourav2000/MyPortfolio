<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e20"/>
      <stop offset="1" stop-color="#120a24"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9d00"/>
      <stop offset="1" stop-color="#ffd24d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2444" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)" opacity="0.6"/>

  <!-- terminal window -->
  <rect x="70" y="60" width="540" height="270" rx="12" fill="#0b1020" stroke="#ff9d00" stroke-width="1.5" filter="url(#glow)" opacity="0.97"/>
  <rect x="70" y="60" width="540" height="34" rx="12" fill="#141b36"/>
  <circle cx="94" cy="77" r="6" fill="#ff5f56"/>
  <circle cx="114" cy="77" r="6" fill="#ffbd2e"/>
  <circle cx="134" cy="77" r="6" fill="#27c93f"/>
  <text x="340" y="82" fill="#7c8db0" font-size="13" text-anchor="middle">devforge — local codebase intelligence</text>

  <text x="95" y="130" font-size="16" fill="#4dff9d">$ devforge ask "where is the auth flow?"</text>
  <text x="95" y="162" font-size="14" fill="#7c8db0">▸ indexing repo… <tspan fill="#00e5ff">SHA-256 delta · 0 cloud calls</tspan></text>
  <text x="95" y="192" font-size="14" fill="#7c8db0">▸ hybrid retrieval <tspan fill="#b44dff">BM25 + vectors</tspan></text>
  <text x="95" y="230" font-size="15" fill="#e8f2ff">auth flow lives in <tspan fill="#ffd24d">src/auth/session.ts:42-118</tspan></text>
  <text x="95" y="258" font-size="15" fill="#e8f2ff">token refresh → <tspan fill="#ffd24d">middleware/refresh.ts:12</tspan></text>
  <text x="95" y="300" font-size="16" fill="#4dff9d">$ <tspan fill="#e8f2ff">█</tspan></text>

  <!-- floating chips -->
  <g font-size="13" text-anchor="middle">
    <rect x="640" y="90" width="120" height="30" rx="15" fill="none" stroke="#00e5ff" filter="url(#glow)"/>
    <text x="700" y="110" fill="#00e5ff">NO API KEYS</text>
    <rect x="650" y="150" width="100" height="30" rx="15" fill="none" stroke="#4dff9d" filter="url(#glow)"/>
    <text x="700" y="170" fill="#4dff9d">OFFLINE</text>
    <rect x="640" y="210" width="120" height="30" rx="15" fill="none" stroke="#b44dff" filter="url(#glow)"/>
    <text x="700" y="230" fill="#b44dff">OLLAMA</text>
  </g>

  <text x="70" y="404" font-size="52" font-weight="bold" fill="url(#ttl)" filter="url(#glow)" letter-spacing="6" font-family="Arial, sans-serif">DEVFORGE</text>
  <text x="72" y="428" font-size="15" fill="#7c8db0" letter-spacing="3">TALK TO YOUR CODEBASE · 100% LOCAL</text>
</svg>
