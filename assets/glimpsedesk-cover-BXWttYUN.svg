<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1022"/>
      <stop offset="1" stop-color="#071a24"/>
    </linearGradient>
    <linearGradient id="gttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#4db5ff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16305c"/>
      <stop offset="1" stop-color="#0d1b38"/>
    </linearGradient>
    <filter id="gglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ggrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#152344" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#gbg)"/>
  <rect width="800" height="450" fill="url(#ggrid)" opacity="0.6"/>

  <!-- app window -->
  <rect x="90" y="55" width="620" height="280" rx="12" fill="#0b1226" stroke="#00e5ff" stroke-width="1.5" filter="url(#gglow)" opacity="0.97"/>
  <!-- titlebar with tabs -->
  <rect x="90" y="55" width="620" height="36" rx="12" fill="#121c3a"/>
  <rect x="106" y="63" width="120" height="24" rx="6" fill="#1c2c56"/>
  <text x="166" y="80" fill="#e8f2ff" font-size="13" text-anchor="middle">media ▾</text>
  <rect x="232" y="63" width="110" height="24" rx="6" fill="#0e1730"/>
  <text x="287" y="80" fill="#5f7396" font-size="13" text-anchor="middle">notes.md</text>
  <circle cx="688" cy="73" r="5" fill="#ff5f56"/>
  <circle cx="668" cy="73" r="5" fill="#ffbd2e"/>

  <!-- sidebar file tree -->
  <rect x="90" y="91" width="150" height="244" fill="#0d1530"/>
  <g font-size="13" fill="#7c8db0" font-family="Consolas, monospace">
    <text x="106" y="118" fill="#00e5ff">▾ Projects</text>
    <text x="120" y="142">▸ renders</text>
    <text x="120" y="166" fill="#e8f2ff">▾ clips</text>
    <text x="134" y="190" fill="#4db5ff">▶ demo.mp4</text>
    <text x="134" y="214">img_04.png</text>
    <text x="120" y="238">▸ docs</text>
    <text x="106" y="262">▸ Downloads</text>
    <text x="106" y="286">▸ Desktop</text>
  </g>

  <!-- media tiles -->
  <g>
    <rect x="258" y="108" width="130" height="90" rx="8" fill="url(#tile)"/>
    <polygon points="313,140 313,166 336,153" fill="#00e5ff" filter="url(#gglow)"/>
    <rect x="402" y="108" width="130" height="90" rx="8" fill="url(#tile)"/>
    <circle cx="440" cy="140" r="12" fill="#ffd24d" opacity="0.9"/>
    <polygon points="410,186 450,148 480,170 510,142 528,186" fill="#4db5ff" opacity="0.75"/>
    <rect x="546" y="108" width="130" height="90" rx="8" fill="url(#tile)"/>
    <polygon points="601,140 601,166 624,153" fill="#b44dff" filter="url(#gglow)"/>
    <rect x="258" y="212" width="130" height="90" rx="8" fill="url(#tile)"/>
    <g stroke="#4dff9d" stroke-width="3" opacity="0.85">
      <line x1="278" y1="286" x2="278" y2="252"/>
      <line x1="298" y1="286" x2="298" y2="238"/>
      <line x1="318" y1="286" x2="318" y2="262"/>
      <line x1="338" y1="286" x2="338" y2="230"/>
      <line x1="358" y1="286" x2="358" y2="248"/>
    </g>
    <rect x="402" y="212" width="274" height="90" rx="8" fill="#0d1834"/>
    <text x="418" y="240" font-size="14" fill="#00e5ff" font-family="Consolas, monospace"># README.md</text>
    <rect x="418" y="252" width="180" height="7" rx="3" fill="#2a3c6e"/>
    <rect x="418" y="268" width="230" height="7" rx="3" fill="#22325e"/>
    <rect x="418" y="284" width="140" height="7" rx="3" fill="#22325e"/>
  </g>

  <text x="90" y="404" font-size="52" font-weight="bold" fill="url(#gttl)" filter="url(#gglow)" letter-spacing="5">GLIMPSEDESK</text>
  <text x="92" y="428" font-size="15" fill="#7c8db0" letter-spacing="3" font-family="Consolas, monospace">VS CODE-STYLE MEDIA &amp; FILE EXPLORER · ELECTRON</text>
</svg>
